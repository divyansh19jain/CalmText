<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/single-logo.png" />
    <link rel="apple-touch-icon" href="/single-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600;700&display=swap" />
    <meta name="description" content="Stop misunderstandings by text. Gain understanding. Stop arguments. Be a good human. You text, not AI, while Pax guides you to keep it cool, calm, and collected." />
    <title>CalmText Pax</title>
    <script>
      // Apply theme before first paint to avoid a flash of the wrong theme
      (function () {
        try {
          var t = localStorage.getItem('ct_theme');
          if (!t) {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
